name: update prices

on:
  schedule:
    # daily at 06:17 UTC — off the hour to avoid the Actions rush
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data and site
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          SITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python3 scripts/build.py

      - name: Commit refreshed data
        run: |
          git config user.name "price-index-bot"
          git config user.email "actions@github.com"
          git add data/prices.json data/prices.csv data/meta.json README.md
          if git diff --staged --quiet; then
            echo "no price changes today"
          else
            git commit -m "data: refresh prices ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
